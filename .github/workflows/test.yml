name: Test
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install tytanic
        run: cargo binstall tytanic@0.4.0 -y

      - name: Setup typst
        uses: typst-community/setup-typst@v4

      - name: Run test suite
        run: tt run

      - name: Run bundle regression test
        run: >-
          typst compile --features bundle --format bundle --root .
          tests/issues/i406-bundle-headings/bundle.typ
          "$RUNNER_TEMP/i406-bundle"

      - name: Run pdfpc bundle regression test
        run: |
          typst compile --features bundle --format bundle --root . \
            tests/issues/i408-pdfpc-bundle/bundle.typ "$RUNNER_TEMP/i408-bundle"
          # Every presentation gets its own `.pdfpc` asset next to its PDF, and
          # that file must carry its own speaker notes only.
          out="$RUNNER_TEMP/i408-bundle"
          grep -q "Note A1" "$out/slides-a.pdfpc"
          grep -q "Note B1" "$out/decks/slides-b.pdfpc"
          ! grep -q "Note B1" "$out/slides-a.pdfpc"
          ! grep -q "Note A1" "$out/decks/slides-b.pdfpc"

      - name: Archive diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5

  typstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run typstyle
        uses: typstyle-rs/typstyle-action@main
      - name: Check for changes
        # Fails the CI job if typstyle modified any files.
        # This ensures developers format their code before merging.
        run: git diff --exit-code
