name: Test
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install tytanic
        run: cargo binstall tytanic@0.4.0 -y

      - name: Setup typst
        uses: typst-community/setup-typst@v4

      - name: Run test suite
        run: tt run

      - name: Run bibliography convergence regression test (#395)
        # Compile-only test whose assertion is "emits no warnings", so it has to
        # run with warnings promoted to errors. It cannot join the main `tt run`
        # above: other tests deliberately emit warnings (touying delivers its own
        # warnings through uniwarn, which shows up as an unknown-font-family
        # warning), so promoting warnings suite-wide would fail them.
        run: tt run --warnings promote issues/i395-bibliography-convergence

      - name: Run bundle regression test
        run: >-
          typst compile --features bundle --format bundle --root .
          tests/issues/i406-bundle-headings/bundle.typ
          "$RUNNER_TEMP/i406-bundle"

      - name: Archive diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5

  typstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run typstyle
        uses: typstyle-rs/typstyle-action@main
      - name: Check for changes
        # Fails the CI job if typstyle modified any files.
        # This ensures developers format their code before merging.
        run: git diff --exit-code
